<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nick Friesen's photography gallery.">
    <title>Nick Friesen | Gallery</title>
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
    <main class="terminal-shell">
        <div class="terminal-topbar">
            <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="terminal-title">nickyfr33ze.github.io -- /gallery</div>
        </div>
        <section class="terminal-body">
            <div class="prompt-line">
                <span class="prompt">user@nickyfr33ze:$</span>
                <span class="command">cd gallery/ | ls -la</span>
            </div>
            <div class="output">
                <p class="section-label">Gallery</p>
                <p>Photos I like enough to put on the internet. Landscapes, single-subject shots, golden hour, city scenes, forest paths, and the dog. Obviously.</p>
                <p><a href="/home/">return /home/</a></p>
            </div>

            <div class="gallery-grid">
        <figure class="gallery-item">
            <img src="../assets/images/doggo_close_up.jpeg" alt="My Doggo">
            <figcaption>Say hi.</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="../assets/images/morning_sunrise.jpg" alt="Vibrant Sunrise">
            <figcaption>My favorite sunrise.</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="../assets/images/city_fountain.jpeg" alt="A City Fountain">
            <figcaption>Gloomy day, but colorful.</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="../assets/images/forest_path.jpeg" alt="Forest Path">
            <figcaption>A peaceful forest path.</figcaption>
        </figure>
            </div>
        </section>
    </main>
</body>
</html>
